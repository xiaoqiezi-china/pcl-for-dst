name: Build
on:
  push:
    # tag 推送不带文件变更，会被 paths 过滤掉，因此 tags 单独列出。
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      shell: pwsh
      run: |
        # 以 Environment.GetEnvironmentVariable(...) 为锚点，避开声明行的类型与修饰符。
        # 用 .Replace() 而非 -replace：锚点是字面量，且 -replace 的替换串里 $ 有特殊含义。
        $ErrorActionPreference = 'Stop'
        $utf8 = New-Object System.Text.UTF8Encoding($false)

        $secretFile = 'Plain Craft Launcher 2\Modules\ModSecret.vb'
        $secretText = [System.IO.File]::ReadAllText((Resolve-Path $secretFile))
        $secretText = $secretText.Replace(
          'Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), ""',
          'Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}"')
        $secretText = $secretText.Replace(
          'Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), ""',
          'Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}"')
        [System.IO.File]::WriteAllText((Resolve-Path $secretFile), $secretText, $utf8)

        $baseFile = 'Plain Craft Launcher 2\Modules\Base\ModBase.vb'
        $baseText = [System.IO.File]::ReadAllText((Resolve-Path $baseFile))
        $baseText = $baseText.Replace(
          'Public Const CommitHash As String = ""',
          'Public Const CommitHash As String = "${{ github.sha }}"')
        [System.IO.File]::WriteAllText((Resolve-Path $baseFile), $baseText, $utf8)

        # 替换未命中不会报错，因此回读校验，对不上就让构建失败。
        $expectId = '${{ secrets.CLIENT_ID }}'
        $expectCf = '${{ secrets.CURSEFORGE_API_KEY }}'
        $expectSha = '${{ github.sha }}'
        $nowSecret = [System.IO.File]::ReadAllText((Resolve-Path $secretFile))
        $nowBase = [System.IO.File]::ReadAllText((Resolve-Path $baseFile))
        if ($expectId -ne '' -and -not $nowSecret.Contains($expectId)) { throw 'ClientId 注入失败：锚点未匹配' }
        if ($expectCf -ne '' -and -not $nowSecret.Contains($expectCf)) { throw 'CurseForge Key 注入失败：锚点未匹配' }
        if (-not $nowBase.Contains($expectSha)) { throw 'CommitHash 注入失败：锚点未匹配' }
        Write-Host '凭据与 CommitHash 注入完成'
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    # 纯逻辑模块不依赖 WPF，可脱离启动器直接跑，放在编译之前。
    - name: Test
      shell: bash
      run: bash tests/run.sh

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

    # 打 tag 才发 Release。启动器的自动更新只认 Release，所以这一步是更新链路的入口。
    # 只跑 Release 配置，避免 Debug 与 Release 抢同名附件。
    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/') && matrix.configuration == 'Release'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = '${{ github.ref_name }}'
        # 只发一个附件，客户端按 .exe 后缀匹配。
        $exe = 'Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe'
        if (-not (Test-Path $exe)) { throw "找不到 Release 产物：$exe" }
        $asset = 'DST Plain Craft Launcher.exe'
        Copy-Item $exe $asset -Force
        gh release view $tag 2>$null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag $asset --title $tag --generate-notes
        } else {
          gh release upload $tag $asset --clobber
        }
